name: 'os-starve'
version: 1
author: 'tools/run_scenarios.py'
steps:
  - wait-serial: 'READY'
  - delay: 100ms
  - write-serial: "mode live\n"
  - wait-serial: 'MODE,LIVE'
  - delay: 30ms
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS,END'
  - delay: 10ms
  - write-serial: "stats reset\n"
  - wait-serial: 'STATS,RESET'
  - delay: 10ms
  - write-serial: "fault starve\n"
  - wait-serial: 'STARVE,'
  - delay: 20ms
  - write-serial: "stats\n"
  - wait-serial: 'STATS,END'
  - delay: 20ms
  - write-serial: "mem\n"
  - delay: 30ms
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS,END'
  - delay: 10ms
  - write-serial: "stack\n"
  - wait-serial: 'task=MSP'
  - delay: 10ms
  - write-serial: "heap\n"
  - wait-serial: 'HEAP'
  - delay: 10ms

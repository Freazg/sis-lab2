name: 's1'
version: 1
author: 'tools/run_scenarios.py'
steps:
  - wait-serial: 'READY'
  - delay: 100ms
  - write-serial: "perfcal\n"
  - wait-serial: 'PERFCAL read_cyc'
  - delay: 10ms
  - write-serial: "mode hold\n"
  - wait-serial: 'MODE,HOLD'
  - delay: 30ms
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS,END'
  - delay: 10ms
  - write-serial: "stats reset\n"
  - wait-serial: 'STATS,RESET'
  - delay: 10ms
  - delay: 10000ms
  - write-serial: "stats\n"
  - wait-serial: 'STATS,END'
  - delay: 20ms
  - write-serial: "mem\n"
  - delay: 30ms
  - write-serial: "tasks\n"
  - wait-serial: 'TASKS,END'
  - delay: 10ms
  - write-serial: "stack\n"
  - wait-serial: 'task=MSP'
  - delay: 10ms
  - write-serial: "heap\n"
  - wait-serial: 'HEAP'
  - delay: 10ms

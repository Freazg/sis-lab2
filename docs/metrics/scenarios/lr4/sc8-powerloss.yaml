name: 'sc8-powerloss'
version: 1
author: 'tools/run_scenarios.py'
steps:
  - wait-serial: 'READY'
  - delay: 100ms
  - write-serial: "mode rec\n"
  - wait-serial: 'MODE,REC'
  - delay: 30ms
  - delay: 5000ms
  - write-serial: "fault powerloss\n"
  - wait-serial: 'FAULT,powerloss_armed'
  - wait-serial: 'BOOT,fw='
  - wait-serial: 'READY'
  - delay: 100ms
  - write-serial: "dump\n"
  - wait-serial: 'DUMP,END'
  - delay: 50ms
  - write-serial: "mode play\n"
  - wait-serial: 'MODE,PLAY'
  - delay: 30ms
  - wait-serial: 'PLAY,DONE'
  - delay: 50ms

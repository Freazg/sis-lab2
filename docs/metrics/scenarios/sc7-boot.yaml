name: 'sc7-boot'
version: 1
author: 'tools/run_scenarios.py'
steps:
  - set-control:
      part-id: btn_det_a
      control: pressed
      value: 1
  - set-control:
      part-id: btn_det_b
      control: pressed
      value: 1
  - wait-serial: 'BOOT,first_imu_us'
  - delay: 100ms
  - set-control:
      part-id: btn_det_a
      control: pressed
      value: 0
  - set-control:
      part-id: btn_det_b
      control: pressed
      value: 0
  - delay: 50ms
  - write-serial: "reset\n"
  - wait-serial: 'READY'
  - delay: 300ms
  - set-control:
      part-id: btn_det_a
      control: pressed
      value: 1
  - set-control:
      part-id: btn_det_b
      control: pressed
      value: 1
  - wait-serial: 'BOOT,first_imu_us'
  - delay: 100ms
  - set-control:
      part-id: btn_det_a
      control: pressed
      value: 0
  - set-control:
      part-id: btn_det_b
      control: pressed
      value: 0
  - delay: 50ms
  - write-serial: "reset\n"
  - wait-serial: 'READY'
  - delay: 1000ms
  - set-control:
      part-id: btn_det_a
      control: pressed
      value: 1
  - set-control:
      part-id: btn_det_b
      control: pressed
      value: 1
  - wait-serial: 'BOOT,first_imu_us'
  - delay: 100ms

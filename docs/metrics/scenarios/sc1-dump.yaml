name: 'sc1-dump'
version: 1
author: 'tools/run_scenarios.py'
steps:
  - wait-serial: 'READY'
  - delay: 100ms
  - write-serial: "mode rec\n"
  - wait-serial: 'MODE,REC'
  - delay: 30ms
  - delay: 10000ms
  - write-serial: "mode hold\n"
  - wait-serial: 'MODE,HOLD'
  - delay: 30ms
  - write-serial: "mode live\n"
  - wait-serial: 'MODE,LIVE'
  - delay: 30ms
  - write-serial: "stats reset\n"
  - wait-serial: 'STATS,RESET'
  - delay: 10ms
  - write-serial: "dump\n"
  - wait-serial: 'DUMP,END'
  - delay: 300ms
  - write-serial: "dump\n"
  - wait-serial: 'DUMP,END'
  - delay: 300ms
  - write-serial: "dump\n"
  - wait-serial: 'DUMP,END'
  - delay: 300ms
  - write-serial: "dump\n"
  - wait-serial: 'DUMP,END'
  - delay: 300ms
  - write-serial: "stats\n"
  - wait-serial: 'STATS,END'
  - delay: 20ms
  - write-serial: "mem\n"
  - delay: 30ms

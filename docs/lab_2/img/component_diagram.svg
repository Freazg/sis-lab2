<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" font-family="Helvetica,Arial" font-size="13">
  <rect width="1100" height="640" fill="white"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="20" y="28" font-size="17" font-weight="bold">Component diagram прошивки ЛР2 (стрілка = «залежить від / #include»)</text>

  <!-- Core -->
  <rect x="380" y="50" width="340" height="80" rx="8" fill="#ECEFF1" stroke="#455A64"/>
  <text x="550" y="74" text-anchor="middle" font-weight="bold">Core/  (структура CubeMX)</text>
  <text x="550" y="94" text-anchor="middle">main.c — composition root: MX_*_Init(), збирає app_hw_t</text>
  <text x="550" y="112" text-anchor="middle">stm32c0xx_it.c, stm32c0xx_hal_msp.c, hal_conf.h</text>

  <!-- App -->
  <rect x="60" y="180" width="330" height="120" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="225" y="204" text-anchor="middle" font-weight="bold">App/  (бізнес-логіка, без HAL)</text>
  <text x="225" y="226" text-anchor="middle">app.c — режими LIVE/HOLD, команди cap</text>
  <text x="225" y="244" text-anchor="middle">selftest.c — ST,dev=...,res=PASS|FAIL</text>
  <text x="225" y="262" text-anchor="middle">cli.c, orient.c, app_io.c</text>
  <text x="225" y="282" text-anchor="middle" font-style="italic">app_hw.h — інтерфейс до «заліза»</text>

  <!-- Devices -->
  <rect x="60" y="360" width="330" height="130" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="225" y="384" text-anchor="middle" font-weight="bold">Devices/  (драйвери пристроїв)</text>
  <text x="225" y="406" text-anchor="middle">mpu6050.c, w25q64.c, servo.c, imath.c</text>
  <text x="225" y="428" text-anchor="middle" font-style="italic">bus.h — i2c_bus_t, spi_bus_t, pwm_out_t, dev_time_t</text>
  <text x="225" y="448" text-anchor="middle">(структури з вказівниками на функції + ctx)</text>
  <text x="225" y="470" text-anchor="middle">dev_status.h — коди помилок</text>

  <!-- Platform -->
  <rect x="460" y="360" width="300" height="130" rx="8" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="610" y="384" text-anchor="middle" font-weight="bold">Platform/  (адаптація до плати)</text>
  <text x="610" y="406" text-anchor="middle">board.h — ЄДИНЕ джерело пінів/AF/хендлів</text>
  <text x="610" y="428" text-anchor="middle">platform.c — реалізує bus.h над HAL:</text>
  <text x="610" y="448" text-anchor="middle">platform_i2c1, platform_spi1_flash,</text>
  <text x="610" y="468" text-anchor="middle">platform_pwm_pan/tilt, UART, GPIO</text>

  <!-- Drivers -->
  <rect x="460" y="540" width="300" height="70" rx="8" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="610" y="566" text-anchor="middle" font-weight="bold">Drivers/  (ST, не редагуються)</text>
  <text x="610" y="588" text-anchor="middle">STM32C0xx HAL v1.4.1, CMSIS (VERSIONS.md)</text>

  <!-- tests -->
  <rect x="820" y="180" width="250" height="310" rx="8" fill="#FFFDE7" stroke="#9E9D24" stroke-dasharray="6,4"/>
  <text x="945" y="204" text-anchor="middle" font-weight="bold">tests/  (хост, gcc)</text>
  <text x="945" y="228" text-anchor="middle">Unity v2.6.1</text>
  <text x="945" y="252" text-anchor="middle">doubles/: fake_i2c (FAKE),</text>
  <text x="945" y="270" text-anchor="middle">mock_spi (MOCK), fake_spiflash,</text>
  <text x="945" y="288" text-anchor="middle">fake_time, fake_hw (app_hw_t)</text>
  <text x="945" y="312" text-anchor="middle">vectors/: байти з docs/captures</text>
  <text x="945" y="340" text-anchor="middle">реалізують ті самі bus.h /</text>
  <text x="945" y="358" text-anchor="middle">app_hw.h, що й Platform/</text>
  <text x="945" y="390" text-anchor="middle" font-style="italic">компілюються БЕЗ шляхів HAL —</text>
  <text x="945" y="408" text-anchor="middle" font-style="italic">заборонений include = помилка</text>

  <!-- arrows -->
  <line x1="470" y1="130" x2="300" y2="178" stroke="#333" marker-end="url(#a)"/>
  <line x1="600" y1="130" x2="605" y2="358" stroke="#333" marker-end="url(#a)"/>
  <line x1="660" y1="130" x2="660" y2="538" stroke="#333" marker-end="url(#a)" stroke-dasharray="4,3"/>
  <line x1="225" y1="300" x2="225" y2="358" stroke="#333" marker-end="url(#a)"/>
  <line x1="460" y1="428" x2="392" y2="428" stroke="#333" marker-end="url(#a)"/>
  <text x="400" y="420" font-size="11">реалізує bus.h</text>
  <line x1="610" y1="490" x2="610" y2="538" stroke="#333" marker-end="url(#a)"/>
  <line x1="820" y1="300" x2="392" y2="250" stroke="#9E9D24" marker-end="url(#a)" stroke-dasharray="4,3"/>
  <line x1="820" y1="420" x2="392" y2="430" stroke="#9E9D24" marker-end="url(#a)" stroke-dasharray="4,3"/>

  <text x="20" y="630" font-size="11" fill="#555">Заборонено (перевіряє tools/check_deps.py у make build і CI): App → HAL/Platform/main.h; Devices → HAL/Platform/App; Platform → App.</text>
</svg>

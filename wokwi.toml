[wokwi]
version = 1
firmware = 'firmware/build/firmware.hex'
elf = 'firmware/build/firmware.elf'
# GDB-сервер симулятора: розкоментуйте рядок нижче, симуляція чекатиме підключення
#   arm-none-eabi-gdb -ex "target remote :3333" firmware/build/firmware.elf
# gdbServerPort = 3333
# Серійний порт консолі на TCP для tools/long_run.py (сценарій 6.2.6 у VS Code)
rfc2217ServerPort = 4000

# Моделі пристроїв, яких немає в бібліотеці Wokwi (chips/*/ — вихідний код за datasheet)
[[chip]]
name = 'w25q64'
binary = 'chips/dist/w25q64.chip.wasm'

[[chip]]
name = 'ft232rl'
binary = 'chips/dist/ft232rl.chip.wasm'
